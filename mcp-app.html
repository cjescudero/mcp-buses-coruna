<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Llegadas de buses</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="transit-app">
      <header class="app-header">
        <div class="transit-mark" aria-hidden="true"><span></span><span></span></div>
        <div>
          <p class="app-kicker">Movilidad urbana · A Coruña</p>
          <h1>Próximos buses</h1>
        </div>
      </header>

      <section class="search-panel" aria-labelledby="search-heading">
        <label id="search-heading" for="stop-search">Buscar parada</label>
        <div class="input-wrapper">
          <input
            id="stop-search"
            type="search"
            inputmode="text"
            placeholder="Nombre o número de parada"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="stop-results"
            aria-expanded="false"
            aria-describedby="results-status"
          />
          <span class="search-icon" aria-hidden="true"></span>
        </div>
        <ul class="autocomplete" id="stop-results" role="listbox" aria-label="Resultados de paradas" hidden></ul>
        <p class="sr-only" id="results-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>

      <section class="arrival-workspace" aria-labelledby="stop-name">
        <header class="stop-header">
          <div>
            <p class="stop-code" id="current-stop-label" aria-live="polite" aria-atomic="true" hidden></p>
            <h2 id="stop-name">Selecciona una parada</h2>
            <p class="stop-helper" id="stop-helper">Cargando el catálogo local…</p>
          </div>
          <button class="refresh-button" id="refresh-button" type="button" disabled>
            <span aria-hidden="true">↻</span> Actualizar
          </button>
        </header>
        <div class="freshness-row">
          <span class="freshness-dot" aria-hidden="true"></span>
          <p id="status" role="status" aria-live="polite" aria-atomic="true">Conectando con el servidor MCP…</p>
        </div>
        <div class="arrivals" id="arrivals" aria-busy="false">
          <div class="empty-state">Busca una parada para consultar sus tiempos.</div>
        </div>
      </section>

      <footer>Catálogo local · llegadas proporcionadas por iTranvias</footer>
    </main>

    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
